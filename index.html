<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xsernex Debug - Portale Licenze</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; margin: 0; }
        .container { background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #00f2fe; font-size: 24px; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; background-color: #1f2937; border: 1px solid #374151; border-radius: 6px; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>XSERNEX DEBUG</h1>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="testReg()">Registrati</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://uyouarurqcoyfaxozjrb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_BddM4racaLDFFwVY4rmoFQ_XFg4gv0b';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testReg() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                alert('Errore: ' + error.message);
            } else {
                alert('Registrazione OK! Controlla la mail.');
            }
        }
    </script>
</body>
</html>
