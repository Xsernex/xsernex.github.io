<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xsernex - Portale Licenze</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #00f2fe; font-size: 24px; margin-bottom: 5px; letter-spacing: 1px; }
        .header p { color: #9ca3af; font-size: 13px; }
        .card { background-color: #1f2937; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #374151; }
        .card h3 { font-size: 15px; margin-bottom: 10px; color: #e5e7eb; }
        .card p { font-size: 12px; color: #9ca3af; margin-bottom: 15px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn-google { background: linear-gradient(135deg, #4285F4 0%, #34A853 100%); color: white; margin-bottom: 15px; }
        .btn-primary { background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); color: white; }
        .btn:hover { opacity: 0.9; }
        .divider { display: flex; align-items: center; text-align: center; margin: 15px 0; color: #6b7280; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #374151; }
        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }
        .form-group { margin-bottom: 12px; }
        .form-group input { width: 100%; padding: 10px; background-color: #111827; border: 1px solid #374151; border-radius: 6px; color: white; font-size: 13px; }
        .form-group input:focus { outline: none; border-color: #00c6ff; }
        .toggle-mode { text-align: center; margin-top: 15px; font-size: 12px; color: #9ca3af; }
        .toggle-mode a { color: #00c6ff; text-decoration: none; cursor: pointer; }
        #dashboard-view { display: none; text-align: center; }
        .user-email { color: #00c6ff; font-weight: bold; margin-bottom: 15px; word-break: break-all; }
        .btn-logout { background-color: #ef4444; color: white; margin-top: 15px; }
        .license-status { padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 10px; font-weight: bold; }
        .status-active { background-color: #111827; color: #10b981; border: 1px solid #10b981; }
        .status-inactive { background-color: #111827; color: #ef4444; border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <!-- VISTA AUTENTICAZIONE -->
        <div id="auth-view">
            <div class="header">
                <h1>XSERNEX</h1>
                <p>Portale Ufficiale Gestione Licenze</p>
            </div>

            <div class="card">
                <h3>1. Accesso Rapido</h3>
                <p>Collega subito il tuo account Google in un click.</p>
                <button class="btn btn-google" onclick="loginWithGoogle()">Accedi con Google</button>
                
                <div class="divider">oppure usa email</div>

                <div id="email-form">
                    <div class="form-group">
                        <input type="email" id="email" placeholder="Indirizzo Email">
                    </div>
                    <div class="form-group">
                        <input type="password" id="password" placeholder="Password">
                    </div>
                    <button class="btn btn-primary" id="submit-btn" onclick="handleEmailAuth()">Accedi</button>
                </div>

                <div class="toggle-mode">
                    <span id="toggle-text">Non hai un account?</span> 
                    <a onclick="toggleAuthMode()" id="toggle-link">Registrati</a>
                </div>
            </div>
        </div>

        <!-- VISTA DASHBOARD -->
        <div id="dashboard-view">
            <div class="header">
                <h1>AREA RISERVATA</h1>
                <p>Stato Licenza Xsernex</p>
            </div>
            <div class="card">
                <p>Benvenuto, utente:</p>
                <div class="user-email" id="display-email">caricamento...</div>
                
                <div id="license-box" class="license-status status-inactive">
                    Verifica licenza in corso...
                </div>
            </div>
            <button class="btn btn-logout" onclick="logout()">Disconnetti</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uyouarurqcoyfaxozjrb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_BddM4racaLDFFwVY4rmoFQ_XFg4gv0b';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            const submitBtn = document.getElementById('submit-btn');
            const toggleText = document.getElementById('toggle-text');
            const toggleLink = document.getElementById('toggle-link');

            if (isSignUp) {
                submitBtn.innerText = 'Registrati';
                toggleText.innerText = 'Hai già un account?';
                toggleLink.innerText = 'Accedi';
            } else {
                submitBtn.innerText = 'Accedi';
                toggleText.innerText = 'Non hai un account?';
                toggleLink.innerText = 'Registrati';
            }
        }

        async function loginWithGoogle() {
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin }
            });
            if (error) alert('Errore login Google: ' + error.message);
        }

        async function handleEmailAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Inserisci email e password.');
                return;
            }

            if (isSignUp) {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    alert('Errore registrazione: ' + error.message);
                } else {
                    alert('Registrazione avvenuta! Controlla la mail per confermare l\'account.');
                }
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    alert('Errore di accesso: ' + error.message);
                } else {
                    checkUser();
                }
            }
        }

        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('dashboard-view').style.display = 'block';
                document.getElementById('display-email').innerText = session.user.email;
                
                verifyLicense(session.user.id);
            } else {
                document.getElementById('auth-view').style.display = 'block';
                document.getElementById('dashboard-view').style.display = 'none';
            }
        }

        async function verifyLicense(userId) {
            const licenseBox = document.getElementById('license-box');
            licenseBox.innerText = 'Controllo licenza sul database...';

            const { data, error } = await supabaseClient
                .from('licenses')
                .select('*')
                .eq('user_id', userId)
                .single();

            if (error || !data) {
                licenseBox.className = 'license-status status-inactive';
                licenseBox.innerText = '✖ Nessuna Licenza Associata';
            } else {
                licenseBox.className = 'license-status status-active';
                licenseBox.innerText = `✔ Licenza Trovata (${data.status || 'Attiva'})`;
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            checkUser();
        }

        checkUser();
    </script>
</body>
</html>
