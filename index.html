<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XSERNEX - Portale Gestione Licenze</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 420px; border: 1px solid #334155; }
    h1 { color: #38bdf8; text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; }
    p.subtitle { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.4rem; color: #cbd5e1; font-size: 0.9rem; }
    input { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; outline: none; }
    input:focus { border-color: #38bdf8; }
    .btn-container { display: flex; gap: 10px; margin-top: 1rem; }
    button { width: 100%; padding: 0.75rem; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-login { background: #0284c7; color: white; }
    .btn-login:hover { background: #0369a1; }
    .btn-register { background: #16a34a; color: white; }
    .btn-register:hover { background: #15803d; }
    .alert { padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; display: none; word-break: break-all; }
    .alert-danger { background: #7f1d1d; color: #fca5a5; }
    .alert-success { background: #14532d; color: #86efac; }
    
    /* Dashboard */
    .dashboard { display: none; }
    .license-box { background: #0f172a; border: 1px dashed #38bdf8; padding: 1rem; border-radius: 8px; text-align: center; margin: 1rem 0; word-break: break-all; font-family: monospace; font-size: 1.1rem; color: #38bdf8; }
    .status-badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 1rem; }
    .badge-active { background: #15803d; color: #fff; }
    .badge-inactive { background: #b91c1c; color: #fff; }
    .logout-btn { background: #475569; color: white; margin-top: 1rem; width: 100%; }
    .logout-btn:hover { background: #334155; }
  </style>
</head>
<body>

  <div class="card">
    <div id="auth-section">
      <h1>XSERNEX</h1>
      <p class="subtitle">Portale Ufficiale Gestione Licenze</p>
      
      <div id="alert" class="alert"></div>

      <div class="form-group">
        <label for="email">Email account</label>
        <input type="text" id="email" required placeholder="tuamail@esempio.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <div class="btn-container">
        <button type="button" id="login-btn" class="btn-login">Accedi</button>
        <button type="button" id="register-btn" class="btn-register">Registrati</button>
      </div>
    </div>

    <div id="dashboard-section" class="dashboard">
      <h1>Area Personale</h1>
      <p class="subtitle" id="user-email-display"></p>
      
      <div id="license-container"></div>

      <button class="logout-btn" id="logout-btn">Esci dall'account</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://evdydyoyxbyknlqofctv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2ZHlkeW95eGJ5a25scW9mY3R2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzg2MjAsImV4cCI6MjA1NjgxNDYyMH0.g7i8_g_1r2Z6tU1JqM5Y7-v2Qx9X3Z8lK4m5N6p7Q8r';
    
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showAlert(message, isError = true) {
      const alert = document.getElementById('alert');
      alert.innerText = message;
      alert.className = `alert ${isError ? 'alert-danger' : 'alert-success'}`;
      alert.style.display = 'block';
    }

    function hideAlert() {
      document.getElementById('alert').style.display = 'none';
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      hideAlert();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert('Inserisci email e password.');
        return;
      }

      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        showAlert('Errore login: ' + error.message);
      } else {
        loadDashboard(data.user);
      }
    });

    document.getElementById('register-btn').addEventListener('click', async () => {
      hideAlert();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert('Inserisci email e password per registrarti.');
        return;
      }

      const { data, error } = await client.auth.signUp({ email, password });
      if (error) {
        showAlert('Errore registrazione: ' + error.message);
      } else {
        showAlert('Registrazione completata! Ora puoi fare il login.', false);
      }
    });

    async function loadDashboard(user) {
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('dashboard-section').style.display = 'block';
      document.getElementById('user-email-display').innerText = user.email;

      const { data: licenses, error } = await client
        .from('licenses')
        .select('*')
        .eq('owner_email', user.email);

      const container = document.getElementById('license-container');

      if (error || !licenses || licenses.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; margin: 1.5rem 0;">
            <span class="status-badge badge-inactive">Nessuna Licenza Attiva</span>
            <p style="color: #cbd5e1; font-size: 0.9rem; margin-top: 0.5rem;">
              Non risulta alcuna licenza univoca associata a questa email.
            </p>
          </div>
        `;
      } else {
        const lic = licenses[0];
        container.innerHTML = `
          <div style="text-align: center;">
            <span class="status-badge badge-active">Licenza Attiva</span>
            <p style="color: #94a3b8; font-size: 0.85rem;">La tua chiave personale per Termux:</p>
            <div class="license-box">${lic.license_key}</div>
            <p style="color: #cbd5e1; font-size: 0.85rem;">
              <strong>Scadenza:</strong> ${lic.expires_at ? new Date(lic.expires_at).toLocaleDateString('it-IT') : 'Illimitata'}
            </p>
          </div>
        `;
      }
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await client.auth.signOut();
      document.getElementById('dashboard-section').style.display = 'none';
      document.getElementById('auth-section').style.display = 'block';
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      hideAlert();
    });

    (async () => {
      const { data: { user } } = await client.auth.getUser();
      if (user) {
        loadDashboard(user);
      }
    })();
  </script>
</body>
</html>
